<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configurar Auralith</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #31224d, #09070f 65%);
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      color: #f4f1ff;
    }
    form {
      width: min(520px, calc(100vw - 32px));
      display: grid;
      gap: 14px;
      padding: 28px;
      border: 1px solid #39304d;
      border-radius: 16px;
      background: rgba(18,16,26,.96);
      box-shadow: 0 24px 70px rgba(0,0,0,.4);
    }
    h1 { margin: 0; }
    p { margin: 0; color: #aaa3ba; }
    label { display: grid; gap: 7px; font-weight: 700; }
    input {
      width: 100%;
      border: 1px solid #433a56;
      border-radius: 9px;
      padding: 12px 13px;
      background: #17131f;
      color: #fff;
      outline: none;
    }
    input:focus { border-color: #8b5cf6; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: #8b5cf6;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    #status { min-height: 18px; color: #a78bfa; }
    #status.error { color: #ff9a9a; }
  </style>
</head>
<body>
  <form id="form">
    <h1>Auralith</h1>
    <p>Introduce la dirección donde está instalada tu instancia.</p>
    <label>
      Dirección de Auralith
      <input id="url" type="url" required placeholder="https://tu-auralith.vercel.app" />
    </label>
    <button type="submit">Conectar</button>
    <span id="status"></span>
  </form>
  <script>
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const url = document.getElementById("url").value.trim();
      const status = document.getElementById("status");
      status.className = "";
      status.textContent = "Conectando...";
      const result = await window.auralithDesktop.saveUrl(url);
      if (!result.ok) {
        status.className = "error";
        status.textContent = result.error;
      }
    });
  </script>
</body>
</html>
