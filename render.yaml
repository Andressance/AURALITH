services:
  - type: web
    name: auralith-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: AURALITH_ENV
        value: production
      - key: AURALITH_OWNER_USERNAME
        value: owner
      - key: AURALITH_DB_URL
        sync: false
      - key: AURALITH_OWNER_PASSWORD
        sync: false
      - key: AURALITH_COOKIE_SECURE
        value: "true"
      - key: AURALITH_RESET_OWNER_PASSWORD
        value: "false"
      - key: AURALITH_STORAGE_PROVIDER
        value: neon
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_BUCKET_NAME
        value: music
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: music
      - key: AURALITH_CORS_ORIGINS
        sync: false
      - key: AURALITH_COOKIE_SAMESITE
        value: "none"
