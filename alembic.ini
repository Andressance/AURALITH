# Alembic configuration for Auralith.
#
# Run from the repository root:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"
#
# The database URL is read from AURALITH_DB_URL by apps/api/migrations/env.py,
# so the same command works locally (SQLite) and on Render (Postgres).

[alembic]
script_location = %(here)s/apps/api/migrations
prepend_sys_path = .
version_path_separator = os
