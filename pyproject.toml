[project]
name = "auralith"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.20",
  "mutagen>=1.47",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "boto3>=1.35",
  "Pillow>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28", "pyflakes>=3.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:asyncio"
